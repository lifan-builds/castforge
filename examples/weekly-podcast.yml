# Example show-owned workflow. Adjust cadence, runner, and paths for your show.
name: podcast

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      shadow:
        description: Generate artifacts without public publication
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, macos]
    env:
      NOTEBOOKLM_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_NOTEBOOK_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: python3 -m pip install "castforge[notebooklm,r2]"

      - name: Run episode
        run: |
          FLAGS=""
          if [ "${{ inputs.shadow }}" = "true" ]; then FLAGS="--shadow"; fi
          castforge run --config podcast.yaml --date "$(date +%F)" $FLAGS

      - name: Validate
        if: inputs.shadow != true
        run: castforge validate --config podcast.yaml --date "$(date +%F)" --check-public

      - name: Commit public metadata
        if: inputs.shadow != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ build/manifests/ build/sources/
          git diff --cached --quiet || git commit -m "chore: publish episode $(date +%F)"
          git push

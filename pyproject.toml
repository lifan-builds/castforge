[project]
name = "castforge"
version = "0.1.3"
description = "Open-source framework for automated podcast pipelines"
readme = "README.md"
license = "MIT"
authors = [{ name = "CastForge contributors" }]
requires-python = ">=3.10"
keywords = ["podcast", "automation", "notebooklm", "rss", "gemini"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "anyio>=4",
  "certifi>=2024.8",
  "python-dotenv>=1",
  "PyYAML>=6",
]

[project.optional-dependencies]
gemini = [
  "google-genai>=1.69",
]
notebooklm = [
  "notebooklm-py[browser]>=0.3.4",
]
r2 = [
  "boto3>=1.35",
]
test = [
  "pytest>=8",
]

[project.scripts]
castforge = "castforge.cli:main"

[project.urls]
Homepage = "https://github.com/lifan-builds/castforge"
Repository = "https://github.com/lifan-builds/castforge"
Documentation = "https://github.com/lifan-builds/castforge#readme"
Issues = "https://github.com/lifan-builds/castforge/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

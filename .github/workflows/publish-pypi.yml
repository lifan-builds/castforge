name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable GitHub release tag to publish
        required: true
        default: v0.1.1

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/castforge/
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download immutable release distributions
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --dir dist

      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
